<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Merci — Valkyries Basketball Madagascar</title>
<meta name="description" content="Thank you for supporting the Valkyries Basketball Association.">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#0E1424">
<meta name="color-scheme" content="dark">

<link rel="icon" type="image/jpeg" href="assets/logo.jpeg">
<link rel="apple-touch-icon" href="assets/logo.jpeg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

<style>
  :root{
    --night:#0E1424; --night-2:#141C30; --steel:#5A6B8C;
    --gold:#E0A82E; --gold-soft:#F0C969; --crimson:#C8462F;
    --bone:#F2EDE3; --bone-dim:#C9C3B6; --line:rgba(242,237,227,.12);
    --ff-impact:'Anton',sans-serif; --ff-display:'Oswald',sans-serif;
    --ff-body:'Manrope',system-ui,sans-serif; --ff-data:'Space Grotesk',monospace;
    --maxw:1180px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--night);color:var(--bone);font-family:var(--ff-body);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
  a{color:inherit;text-decoration:none}
  img{max-width:100%;display:block}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}
  h1{font-family:var(--ff-impact);font-weight:400;text-transform:uppercase;letter-spacing:.01em}
  header.nav{position:sticky;top:0;z-index:60;background:rgba(14,20,36,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .nav-inner{display:flex;align-items:center;gap:11px;height:68px}
  .brand{display:flex;align-items:center;gap:11px}
  .brand .mark{width:34px;height:34px;object-fit:cover;border-radius:50%}
  .brand b{font-family:var(--ff-impact);font-size:1.18rem;letter-spacing:.02em}
  .brand small{display:block;font-family:var(--ff-data);font-size:.56rem;letter-spacing:.22em;color:var(--steel);text-transform:uppercase;margin-top:3px}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:60px 0}
  .result{max-width:560px;text-align:center}
  .icon{font-size:3rem;margin-bottom:18px}
  h1{font-size:clamp(2.2rem,6vw,3.4rem);margin-bottom:16px}
  .result p{color:var(--bone-dim);font-size:1.05rem;margin-bottom:32px}
  .btn{font-family:var(--ff-display);font-weight:600;font-size:.88rem;letter-spacing:.08em;text-transform:uppercase;padding:14px 28px;border-radius:2px;cursor:pointer;border:0;display:inline-block;background:var(--gold);color:var(--night);transition:transform .15s ease}
  .btn:hover{transform:translateY(-2px)}
  footer{background:var(--night-2);border-top:1px solid var(--line);padding:24px 0;text-align:center;font-family:var(--ff-data);font-size:.72rem;color:var(--steel)}
</style>
</head>
<body>
<header class="nav">
  <div class="wrap nav-inner">
    <a class="brand" href="index.html" aria-label="Valkyries home">
      <img class="mark" src="assets/logo.jpeg" alt="Valkyries logo">
      <span><b>VALKYRIES</b><small data-i18n="brand_sub">Basketball · Antsirabe</small></span>
    </a>
  </div>
</header>

<main>
  <div class="wrap result">
    <div class="icon">🏀</div>
    <h1 data-i18n="thanks_h">Thank you!</h1>
    <p data-i18n="thanks_p">Your support just sent a Valkyrie further — onto the court, into the classroom, toward her season. If your payment doesn't show as complete yet, it can take a moment on the Papi side.</p>
    <a class="btn" href="index.html" data-i18n="thanks_back">Back to the Valkyries</a>
  </div>
</main>

<footer>
  <span data-i18n="foot_made">A Skyline NGO program · Antsirabe, Madagascar</span>
</footer>

<script>
const I18N = {
  en:{ brand_sub:"Basketball · Antsirabe",
    thanks_h:"Thank you!",
    thanks_p:"Your support just sent a Valkyrie further — onto the court, into the classroom, toward her season. If your payment doesn't show as complete yet, it can take a moment on the Papi side.",
    thanks_back:"Back to the Valkyries",
    foot_made:"A Skyline NGO program · Antsirabe, Madagascar" },
  fr:{ brand_sub:"Basketball · Antsirabe",
    thanks_h:"Merci !",
    thanks_p:"Votre soutien vient de faire avancer une Valkyrie — sur le terrain, en classe, vers sa saison. Si le paiement n'apparaît pas encore comme terminé, cela peut prendre un instant côté Papi.",
    thanks_back:"Retour aux Valkyries",
    foot_made:"Un programme de l'ONG Skyline · Antsirabe, Madagascar" }
};
function langFromStorage(){ try{ return localStorage.getItem("valkyries_lang") || "en"; }catch(e){ return "en"; } }
const d = I18N[langFromStorage()];
document.documentElement.lang = langFromStorage();
document.querySelectorAll("[data-i18n]").forEach(el=>{
  const key = el.getAttribute("data-i18n");
  if(d[key]!==undefined) el.textContent = d[key];
});
document.title = d.thanks_h + " — Valkyries Basketball Madagascar";
</script>
</body>
</html>
